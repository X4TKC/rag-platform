# Local Kubernetes cluster (kind = Kubernetes in Docker).
# One control plane + one worker, like a tiny real cluster.
# Port 30080 on the node is mapped to localhost:8080 to reach the API.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rag
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
