# CI: every push and pull request runs four jobs.
#   test      unit tests (fast, no Docker)
#   helm      lint the chart and render it, so template errors fail early
#   image     build the container image and scan it with Trivy
#   e2e       real deploy: kind cluster + Qdrant + Ollama + the chart, then ask a question
#
# Every third-party action is pinned to a full commit SHA, not a tag: tags can be
# moved by whoever controls the repo (see docs/decisions.md, Trivy incident 2026-03).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # least privilege: this workflow only reads the repo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm lint deploy/helm/rag-api
      - run: helm template rag-api deploy/helm/rag-api > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t rag-api:${{ github.sha }} .
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3            # known-good Trivy binary (v0.69.4 was the malicious one)
          image-ref: rag-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true        # only fail on problems we can actually fix by updating
          exit-code: "1"

  e2e:
    needs: [test, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: rag
          config: deploy/kind/cluster.yaml

      # Ollama runs as a plain container on kind's Docker network, like the host
      # Ollama does locally. CI uses a tiny chat model so the job stays fast.
      - name: Start Ollama with small models
        run: |
          docker run -d --name ollama --network kind ollama/ollama:latest
          for i in $(seq 30); do docker exec ollama ollama list >/dev/null 2>&1 && break; sleep 2; done
          docker exec ollama ollama pull nomic-embed-text
          docker exec ollama ollama pull qwen2.5:0.5b
          echo "OLLAMA_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' ollama)" >> "$GITHUB_ENV"

      - name: Build image and load it into kind
        run: |
          docker build -t rag-api:dev .
          kind load docker-image rag-api:dev --name rag

      - name: Deploy Qdrant and the API
        run: |
          kubectl apply -f deploy/qdrant.yaml
          helm upgrade --install rag-api deploy/helm/rag-api --wait --timeout 5m \
            --set config.OLLAMA_URL=http://$OLLAMA_IP:11434 \
            --set config.CHAT_MODEL=qwen2.5:0.5b

      - name: Smoke test (ingest + ask through the NodePort)
        run: |
          curl -sf localhost:8080/readyz
          make demo | tee demo.json
          grep -q '"source": "runbook-deploys.md"' demo.json

      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods
          kubectl logs deploy/rag-api --tail=100
